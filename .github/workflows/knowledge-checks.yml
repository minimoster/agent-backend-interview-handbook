name: Verify learning contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify metadata and static reading site
        run: |
          node --version
          python3 --version
          python3 -B tools/refresh_question_metadata.py --check
          python3 -B tests/test_question_metadata.py
          node site/build.mjs --check
          node site/test.mjs
      - name: Verify Python algorithm and teaching contracts
        run: |
          python3 -B examples/hot100/check_hot100.py
          python3 -B examples/hot100/check_reading_catalog.py
          python3 -B -m unittest discover -s tests/hot100
          python3 -B tests/hot100/exhaustive_checks.py
          python3 -B tests/test_agi_algorithms.py
          python3 -B -m unittest examples.hot100.test_followup_algorithms -v
          python3 -B examples/interview_algorithms/test_solutions.py
          python3 -B examples/agent_contracts/test_contracts.py
          python3 -B -m unittest discover -s examples/public_interview_scenarios -v
          python3 -B tools/check_scenario_contracts.py
          python3 -B -m unittest discover -s examples/retrieval_worked_examples -p 'test_*.py' -v
          python3 -B -m unittest discover -s examples/algorithm_supplement -p 'test_*.py' -v
          python3 -B -m unittest discover -s examples/interview_followups -v
          python3 -B -m unittest discover -s examples/trusted_evaluation -p 'test_*.py' -v
          python3 -B examples/backend/test_lru.py
          python3 -B examples/sql/check-relational-examples.py
          python3 -B -m unittest discover -s examples/text_to_sql -p 'test_*.py' -v
          python3 -B examples/reasoning/verify-puzzles.py
      - name: Verify Java fixtures
        run: |
          java --version
          java examples/java/OrderedPrinter.java
          java examples/interview_followups/ExecutorFailureLab.java
          output=$(mktemp -d)
          trap 'rm -rf "$output"' EXIT
          javac -d "$output" examples/backend/DclSingleton.java examples/backend/HolderSingleton.java examples/backend/SingletonTest.java
          java -cp "$output" SingletonTest
      - name: Set up Python teaching lab runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify Agent and Python teaching labs
        run: |
          python -m pip install -r examples/requirements.txt -r examples/retrieval_contracts/requirements-mcp.txt
          (cd examples/agent_scenario_contracts && python -B -m unittest -v test_ordering)
          (cd examples && python -B -m unittest -v test_python_language_lab test_fastapi_lab test_coding_kernels test_kv_budget)
          python -B -m unittest discover -s examples/transformer_prerequisite -p 'test_attention_lab.py' -v
          (cd examples/retrieval_contracts && python -B -m unittest -v test_lab test_store_skill && python -B test_mcp_legacy.py)
      - name: Verify Go cancellation and fake SSE fixtures
        working-directory: examples/go/cancellation
        run: |
          go version
          go test -race -count=1 -timeout=60s ./...

      - name: Verify Go bounded follow-up lifecycle
        working-directory: examples/go/followup_lifecycle
        run: |
          go version
          go test -race -count=1 -timeout=60s ./...
